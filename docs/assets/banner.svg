<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Project Template: One command creates a project with CI, Docker, benchmark harness and banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d29922"/><stop offset="0.45" stop-color="#f5fbff"/>
      <stop offset="0.55" stop-color="#f5fbff"/><stop offset="1" stop-color="#d29922"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d29922" stop-opacity="0.30"/><stop offset="1" stop-color="#d29922" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2430" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1040px 180px; }
      @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
      .fade { opacity: 0; animation: fade 8s infinite; }
      @keyframes fade { 0% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: none; } 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 8s ease-out infinite; }
      @keyframes grow { 0% { transform: scaleY(0); } 18% { transform: scaleY(1); } 88% { transform: scaleY(1); opacity: 1; } 96%, 100% { transform: scaleY(1); opacity: 0; } }
      .growx { transform-box: fill-box; transform-origin: left; animation: growx 8s ease-out infinite; }
      @keyframes growx { 0% { transform: scaleX(0); } 18% { transform: scaleX(1); } 88% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
      .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 8s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 35% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { opacity: 0; } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
      .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
      .d7 { animation-delay: 2.1s; } .d8 { animation-delay: 2.4s; } .d9 { animation-delay: 2.7s; }
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <circle class="pulse" cx="1040" cy="180" r="175" fill="url(#glow)"/>
  <rect x="64" y="64" width="6" height="232" rx="3" fill="#d29922"/>
  <text x="96" y="96" class="mono" font-size="16" fill="#d29922" letter-spacing="2">30 DAYS · SCAFFOLD</text>
  <text x="92" y="160" class="sans" font-size="78" font-weight="800" fill="url(#shine)">Project Template</text>
  <text x="96" y="212" class="sans" font-size="20" fill="#9aa7b2">One command creates a project with CI, Docker, benchmark</text><text x="96" y="238" class="sans" font-size="20" fill="#9aa7b2">harness and banner</text>
  <rect x="96" y="262" width="38" height="28" rx="14" fill="#161b22" stroke="#d29922" stroke-opacity="0.45"/><text x="115" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">uv</text><rect x="144" y="262" width="55" height="28" rx="14" fill="#161b22" stroke="#d29922" stroke-opacity="0.45"/><text x="172" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">ruff</text><rect x="209" y="262" width="71" height="28" rx="14" fill="#161b22" stroke="#d29922" stroke-opacity="0.45"/><text x="245" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">pytest</text><rect x="290" y="262" width="71" height="28" rx="14" fill="#161b22" stroke="#d29922" stroke-opacity="0.45"/><text x="326" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Docker</text>
  <g><rect x="850" y="44" width="380" height="272" rx="12" fill="#0d1117" stroke="#2a3542"/><rect x="850" y="44" width="380" height="26" rx="12" fill="#161b22"/><circle cx="868" cy="57" r="5" fill="#ff5f56"/><circle cx="884" cy="57" r="5" fill="#ffbd2e"/><circle cx="900" cy="57" r="5" fill="#27c93f"/><text x="866" y="96" class="mono" font-size="13" fill="#d29922">$ uv run python new_project.py</text><text x="866" y="116" class="mono" font-size="13" fill="#c9d1d9">    ../day-03 --title "CDC"</text><text x="866" y="150" class="mono fade d2" font-size="13" fill="#8b949e">✓ pyproject.toml   uv + ruff + pytest</text><text x="866" y="174" class="mono fade d3" font-size="13" fill="#8b949e">✓ .github/workflows/ci.yml</text><text x="866" y="198" class="mono fade d4" font-size="13" fill="#8b949e">✓ Dockerfile        non-root</text><text x="866" y="222" class="mono fade d5" font-size="13" fill="#8b949e">✓ bench/harness.py  time + RSS</text><text x="866" y="246" class="mono fade d6" font-size="13" fill="#8b949e">✓ docs/assets/banner.svg</text><text x="866" y="270" class="mono fade d7" font-size="13" fill="#3fb950">✓ first commit on main</text><rect class="blink" x="866" y="286" width="9" height="16" fill="#d29922"/></g>
</svg>
